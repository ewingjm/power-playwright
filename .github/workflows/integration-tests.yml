name: Integration tests

on:
  workflow_call:
    inputs:
      environment-label:
        description: A label identifying the target environment (e.g. standard, early). Used in job names, concurrency groups and artifact names.
        type: string
        required: true
    secrets:
      ENVIRONMENT_URL:
        description: The URL of the target environment.
        required: true
      KEYVAULT_URL:
        required: true
      KEYVAULT_TENANTID:
        required: true
      KEYVAULT_CLIENTID:
        required: true
      KEYVAULT_CLIENTSECRET:
        required: true
      AZURE_CREDENTIALS:
        required: true
      AZURE_STORAGE_ACCOUNTNAME:
        required: true

jobs:
  test:
    name: Integration tests (${{ inputs.environment-label }})
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ inputs.environment-label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore integration test dependencies
        run: dotnet restore tests/PowerPlaywright.IntegrationTests/PowerPlaywright.IntegrationTests.csproj
      - name: Build integration test
        run: dotnet build tests/PowerPlaywright.IntegrationTests/PowerPlaywright.IntegrationTests.csproj -c Release --no-restore
      - name: Setup Playwright
        run: |
          chmod +x tests/PowerPlaywright.IntegrationTests/bin/Release/net8.0/.playwright/node/linux-x64/node
          tests/PowerPlaywright.IntegrationTests/bin/Release/net8.0/playwright.ps1 install chromium --with-deps
        shell: pwsh
      - name: Run integration tests
        id: run-tests
        run: dotnet test tests/PowerPlaywright.IntegrationTests/PowerPlaywright.IntegrationTests.csproj -c Release --logger console --logger html --results-directory TestResults --collect:"XPlat code coverage" --no-build -- NUnit.NumberOfTestWorkers=${{ vars.TEST_NUMBEROFTESTWORKERS }} Playwright.LaunchOptions.Headless=true
        env:
          POWERPLAYWRIGHT__TEST__URL: ${{ secrets.ENVIRONMENT_URL }}
          POWERPLAYWRIGHT__TEST__KEYVAULT__URL: ${{ secrets.KEYVAULT_URL }}
          POWERPLAYWRIGHT__TEST__KEYVAULT__TENANTID: ${{ secrets.KEYVAULT_TENANTID }}
          POWERPLAYWRIGHT__TEST__KEYVAULT__CLIENTID: ${{ secrets.KEYVAULT_CLIENTID }}
          POWERPLAYWRIGHT__TEST__KEYVAULT__CLIENTSECRET: ${{ secrets.KEYVAULT_CLIENTSECRET }}
        if: ${{ always() }}
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ inputs.environment-label }}
          path: TestResults
        if: ${{ always() }}
      - name: Login to Azure
        id: azure-login
        if: ${{ failure() && steps.run-tests.outcome == 'failure' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Upload traces to Blob Storage
        if: ${{ failure() && steps.azure-login.conclusion == 'success' }}
        uses: azure/CLI@v2
        with:
          inlineScript: az storage blob upload-batch --account-name '${{ secrets.AZURE_STORAGE_ACCOUNTNAME }}' --auth-mode login -d 'playwright-traces' -s 'tests/PowerPlaywright.IntegrationTests/bin/Release/net8.0/playwright-traces' --destination-path '${{ github.workflow }}/${{ github.run_number }}_${{ github.run_attempt }}_${{ inputs.environment-label }}' --overwrite
      - name: Logout of Azure
        if: ${{ failure() && steps.azure-login.conclusion == 'success' }}
        run: az logout
