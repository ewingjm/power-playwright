name: Power Playwright

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'LICENSE'
      - '**/*.editorconfig'
      - '**/*.gitignore'
      - '**/*.md'
  pull_request: 
    branches: [ main ]
    paths-ignore: 
      - 'LICENSE'
      - '**/*.editorconfig'
      - '**/*.gitignore'
      - '**/*.md'
  workflow_dispatch: 
    inputs:
      run-test-job:
        default: true
        type: boolean
        description: Run test job
      run-deploy-job:
        default: false
        type: boolean
        description: Run deploy job

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Run unit tests
        id: test
        run: dotnet test tests/PowerPlaywright.UnitTests/PowerPlaywright.UnitTests.csproj -c Release --logger console --logger html --no-build --results-directory TestResults --collect:"XPlat code coverage"
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
        if: ${{ always() }}
      - name: Pack
        run: dotnet pack --no-restore --output nupkg -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg
  test:
    name: Test (standard release cycle)
    needs: build
    if: ${{ success() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run-test-job)) }}
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      ENVIRONMENT_URL: ${{ secrets.TEST_ENVIRONMENT_STANDARD_URL }}
      KEYVAULT_URL: ${{ secrets.TEST_KEYVAULT_URL }}
      KEYVAULT_TENANTID: ${{ secrets.TEST_KEYVAULT_TENANTID }}
      KEYVAULT_CLIENTID: ${{ secrets.TEST_KEYVAULT_CLIENTID }}
      KEYVAULT_CLIENTSECRET: ${{ secrets.TEST_KEYVAULT_CLIENTSECRET }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_STORAGE_ACCOUNTNAME: ${{ secrets.AZURE_STORAGE_ACCOUNTNAME }}
    with:
      environment-label: standard
  deploy:
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.test.result) && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run-deploy-job)) }}
    needs: [ build, test ]
    permissions:
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push "nupkg/**/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
